defaults:
  - override /trainer_cfg@_global_: base_trainer
  - override /model_cfg@_global_: prelude/prelude9b
  - override /data_cfg@_global_: fineweb_edu_shuffled
  - _self_

# --- Model: openeurollm/prelude, revision anneal300b_iter_0989075 (Qwen3, ~9B) ---
# Path, dtype (bf16) and log name come from cfgs/model_cfg/prelude/prelude9b.yaml
custom_class: custom_models.drope.DroPEQwen3ForCausalLM
from_pretrained: true
drope: true

model_custom_config:
  _target_: custom_models.drope.DroPEQwen3Config.from_pretrained
  pretrained_model_name_or_path: ${model_name_or_path}
  attention_type: nope

# --- Recalibration settings (from llama2_7b_drope.yaml) ---
max_seq_length: 4096          # prelude's native context length
train_batch_size: 512         # sequences per optimizer step (~2.1M tokens)
per_device_train_batch_size: 1
max_steps: 5000               # ~10B tokens; the paper used 20B for Llama-2-7B (= 10000 steps)
learning_rate: 1.0e-4
lr_scheduler_type: cosine
save_steps: 250               # each ZeRO-3 checkpoint is ~130 GB (weights + optimizer state)

trainer_args:
  warmup_steps: 100           # overrides the base warmup_ratio
  save_total_limit: 2         # keep only the 2 newest checkpoints

wandb_project: drope-prelude
wandb_run_name: ${trainer_log_name}_${model_log_name}_${max_steps}steps_bs${train_batch_size}_lr${learning_rate}