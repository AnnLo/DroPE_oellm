# Arm B: plain DroPE (as prelude_drope), long-document data.
defaults:
  - override /trainer_cfg@_global_: base_trainer
  - override /model_cfg@_global_: prelude/prelude9b
  - override /data_cfg@_global_: fineweb_edu_shuffled
  - _self_

custom_class: custom_models.drope.DroPEQwen3ForCausalLM
from_pretrained: true
drope: true
model_custom_config:
  _target_: custom_models.drope.DroPEQwen3Config.from_pretrained
  pretrained_model_name_or_path: ${model_name_or_path}
  attention_type: nope

max_seq_length: 4096
train_batch_size: 512
per_device_train_batch_size: 2
max_steps: 5000              # 512 x 4096 x 5000 = 10.5B tokens
learning_rate: 1.0e-4
lr_scheduler_type: cosine
save_steps: 250
trainer_args:
  warmup_steps: 100
  save_total_limit: 2

# long-document mix: each training block is one contiguous document window
data_log_name: longctx_longdoc_10b
make_dataset_fn:
  doc_blocks: true

wandb_project: drope-prelude-ablations
wandb_run_name: B_drope_longdoc_${model_log_name}_${max_steps}steps